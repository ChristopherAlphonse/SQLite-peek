name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          git log ${previous:+"$previous"..HEAD} --no-merges --pretty='- %s' | grep -v '^- Release v' > notes.md || true
          [ -s notes.md ] || echo "- Maintenance release." > notes.md
          node -e '
            const fs = require("fs");
            const notes = fs.readFileSync("notes.md", "utf8").trim();
            const log = fs.readFileSync("CHANGELOG.md", "utf8");
            const entry = `## ${process.env.VERSION}\n\n${notes}\n\n`;
            fs.writeFileSync("CHANGELOG.md", log.replace(/^(# Changelog\n+)/, `$1${entry}`));
          '

      - run: npm run package

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath sqlite-peek.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" sqlite-peek.vsix --title "v$VERSION" --notes-file notes.md
